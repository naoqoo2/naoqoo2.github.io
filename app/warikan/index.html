<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>warikan</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./shared.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f5ef; color: #20342c; font: 16px/1.5 system-ui, sans-serif; }
    main {
      width: min(100%, 600px); min-height: 100svh; min-height: 100dvh;
      margin: 0 auto; padding: clamp(10px, 3vh, 28px) 16px;
      display: flex; flex-direction: column; gap: clamp(8px, 2vh, 20px);
    }
    [hidden] { display: none !important; }
    form, #result { flex: 1; display: flex; flex-direction: column; }
    form > button { margin-top: auto; }
    #result dl { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .secondary { color: #235840; background: #edf4ed; }
    @media (min-height: 540px) {
      main { height: 100svh; height: 100dvh; }
    }
    #install-promo {
      flex-shrink: 0; display: flex; justify-content: center;
    }
    #install-help {
      display: inline-flex; align-items: center; width: auto; padding: 0;
      color: inherit; background: transparent;
      gap: clamp(12px, 4vw, 16px);
    }
    .install-icon { display: block; width: 76px; height: 76px; border-radius: 22%; box-shadow: 0 4px 12px #20342c24; }
    .install-copy { text-align: left; }
    .install-message { display: block; font-size: .85rem; font-weight: 650; margin-bottom: 6px; }
    .install-label { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: .8rem; background: #e1ebdc; color: #235840; }
    dialog { width: min(400px, calc(100% - 28px)); max-height: calc(100dvh - 32px); overflow-y: auto; border: 0; border-radius: 28px; padding: 24px; color: #20342c; background: #faf9f3; box-shadow: 0 24px 80px #15312440; }
    dialog::backdrop { background: rgb(20 40 30 / .45); backdrop-filter: blur(4px); }
    dialog .install-icon { width: 88px; height: 88px; margin: 0 auto 12px; }
    dialog h2 { font-size: 1.15rem; color: #20342c; text-align: center; }
    dialog ol { list-style: none; counter-reset: steps; padding: 0; margin: 16px 0; }
    dialog li { counter-increment: steps; display: flex; align-items: flex-start; gap: 10px; margin: 8px 0; padding: 12px; border-radius: 16px; background: #fff; font-size: .85rem; }
    dialog li::before { content: counter(steps); flex: 0 0 24px; line-height: 24px; text-align: center; border-radius: 50%; background: #e1ebdc; color: #235840; font-weight: 750; }
    dialog p { font-size: .85rem; margin: 12px 0; text-align: center; color: #52675a; }
    #install-close { border-radius: 16px; }
    @media (max-height: 650px) {
      form, section { padding: 12px !important; }
      fieldset { margin: 8px 0 !important; }
      dl div { padding: 3px 0 !important; }
      .count-card { padding: 6px !important; }
      #install-promo .install-icon { height: 60px; width: 60px; }
    }
    @media (max-height: 540px) and (min-width: 600px) {
      main { max-width: 900px; }
      .groups { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
      #result dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    }
    p { margin: 0; }
    form, section { padding: 20px; border: 1px solid #d9ded6; border-radius: 20px; background: #fff; }
    fieldset { border: 0; margin: 18px 0; padding: 0; min-width: 0; }
    legend { font-weight: 700; margin-bottom: 8px; }
    label { font-weight: 650; }
    .field { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    input, button { font: inherit; border-radius: 10px; min-height: 44px; }
    input { width: 100%; min-width: 0; padding: 8px; border: 1px solid #a8b7ae; color: inherit; background: #fff; }
    .groups { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .count-card { text-align: center; background: #edf4ed; border-radius: 12px; padding: 10px 6px; }
    .count-card { min-width: 0; padding: 8px 2px; }
    .count-card label { display: block; font-size: .85rem; white-space: nowrap; }
    .count-card .field { gap: 1px; margin: 4px 0; }
    .count-card input { padding: 4px 1px; text-align: center; appearance: textfield; -moz-appearance: textfield; }
    .count-card input::-webkit-inner-spin-button,
    .count-card input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .count-step { min-height: 44px; font-size: 1.4rem; color: #235840; background: #dce9dc; }
    .count-step:disabled { opacity: .35; cursor: default; }
    @media (max-width: 380px) {
      main { padding-left: 10px; padding-right: 10px; }
      form { padding: 12px; }
      .count-card label { font-size: .75rem; }
    }
    .icon { display: block; font-size: 1.45rem; }
    button { border: 0; width: 100%; background: #235840; color: #fff; font-weight: 750; cursor: pointer; }
    :focus-visible { outline: 3px solid #408b64; outline-offset: 3px; }

    h2 { margin: 0 0 8px; font-size: .85rem; font-weight: 600; color: #52675a; }
    dl { margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; }
    .result-count { font-size: .8rem; color: #52675a; white-space: nowrap; }
    dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
    .change { margin-top: 6px; border-top: 1px solid #d9ded6; }
    #error { color: #9d3020; margin: 8px 0 0; }
    #error:empty { display: none; }
  </style>
  <script src="./warikan.js" defer></script>
</head>
<body>
  <main>
    <header class="site-header">
      <h1 class="site-name">warikan</h1>
      <p>飲み会のお会計を、いい感じに割り勘。</p>
    </header>
    <form id="split">
      <label for="total">お会計</label>
      <div class="field"><input id="total" type="number" inputmode="numeric" min="1" max="999999999" required value="0" placeholder="0"><span>円</span></div>
      <fieldset>
        <legend>人数</legend>
        <div class="groups">
          <div class="count-card">
            <label for="count-0"><span class="icon" aria-hidden="true">👑</span>大富豪</label>
            <button class="count-step" type="button" data-step="1" data-target="count-0" aria-label="大富豪を1人増やす">＋</button>
            <span class="field"><input id="count-0" name="count" aria-label="大富豪の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
            <button class="count-step" type="button" data-step="-1" data-target="count-0" aria-label="大富豪を1人減らす">−</button>
          </div>
          <div class="count-card">
            <label for="count-1"><span class="icon" aria-hidden="true">💎</span>富豪</label>
            <button class="count-step" type="button" data-step="1" data-target="count-1" aria-label="富豪を1人増やす">＋</button>
            <span class="field"><input id="count-1" name="count" aria-label="富豪の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
            <button class="count-step" type="button" data-step="-1" data-target="count-1" aria-label="富豪を1人減らす">−</button>
          </div>
          <div class="count-card">
            <label for="count-2"><span class="icon" aria-hidden="true">🙂</span>平民</label>
            <button class="count-step" type="button" data-step="1" data-target="count-2" aria-label="平民を1人増やす">＋</button>
            <span class="field"><input id="count-2" name="count" aria-label="平民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="2"><span>人</span></span>
            <button class="count-step" type="button" data-step="-1" data-target="count-2" aria-label="平民を1人減らす">−</button>
          </div>
          <div class="count-card">
            <label for="count-3"><span class="icon" aria-hidden="true">🌱</span>貧民</label>
            <button class="count-step" type="button" data-step="1" data-target="count-3" aria-label="貧民を1人増やす">＋</button>
            <span class="field"><input id="count-3" name="count" aria-label="貧民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
            <button class="count-step" type="button" data-step="-1" data-target="count-3" aria-label="貧民を1人減らす">−</button>
          </div>
          <div class="count-card">
            <label for="count-4"><span class="icon" aria-hidden="true">🐣</span>大貧民</label>
            <button class="count-step" type="button" data-step="1" data-target="count-4" aria-label="大貧民を1人増やす">＋</button>
            <span class="field"><input id="count-4" name="count" aria-label="大貧民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
            <button class="count-step" type="button" data-step="-1" data-target="count-4" aria-label="大貧民を1人減らす">−</button>
          </div>
        </div>
      </fieldset>
      <button type="submit">割り勘</button>
      <p id="error" role="alert"></p>
    </form>
      <section id="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title" tabindex="-1">1人あたり</h2>
        <dl>
          <div><dt>👑 大富豪 <span class="result-count" data-count></span></dt><dd data-price></dd></div>
          <div><dt>💎 富豪 <span class="result-count" data-count></span></dt><dd data-price></dd></div>
          <div><dt>🙂 平民 <span class="result-count" data-count></span></dt><dd data-price></dd></div>
          <div><dt>🌱 貧民 <span class="result-count" data-count></span></dt><dd data-price></dd></div>
          <div><dt>🐣 大貧民 <span class="result-count" data-count></span></dt><dd data-price></dd></div>
          <div class="change"><dt>合計</dt><dd id="collected"></dd></div>
          <div><dt>お会計</dt><dd id="payment"></dd></div>
          <div><dt>おつり</dt><dd id="change"></dd></div>
        </dl>
        <div class="actions">
          <button id="back" class="secondary" type="button">戻る</button>
          <button id="retry" type="button">再計算</button>
        </div>
      </section>
    <div id="install-promo">
      <button id="install-help" type="button" aria-haspopup="dialog" aria-labelledby="install-label">
        <img class="install-icon" src="./icon.svg" alt="" width="76" height="76">
        <span class="install-copy">
          <span class="install-message">追加して便利に使おう！</span>
          <span class="install-label" id="install-label">ホーム画面に追加</span>
        </span>
      </button>
    </div>
    <footer class="site-footer">
      <a href="./about/index.html">使い方・計算ルール</a>
      <p>made with <span aria-label="love">♥</span> by <a href="https://naoqoo2.com/apps/">naoqoo2</a></p>
    </footer>
  </main>
  <dialog id="install-dialog" aria-labelledby="install-title">
    <img class="install-icon" src="./icon.svg" alt="" width="88" height="88">
    <h2 id="install-title">warikanをホーム画面に</h2>
    <p id="install-intro"></p>
    <ol id="install-steps"></ol>
    <button id="install-close" type="button" autofocus>わかった！</button>
  </dialog>
</body>
</html>
