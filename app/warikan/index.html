<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd84d">
  <title>warikan</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./shared.css">
  <style>
    body { font-family: var(--font-pop); font-size: 16px; line-height: 1.5; }
    [hidden] { display: none !important; }
    p { margin: 0; }
    main {
      width: min(100%, 600px); min-height: 100svh; min-height: 100dvh;
      margin: 0 auto;
      padding: max(clamp(10px, 2.5vh, 24px), env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(clamp(10px, 2.5vh, 24px), env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: clamp(8px, 1.8vh, 18px);
    }

    /* カード共通 */
    form, #result {
      flex: 1; min-height: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 16px);
      margin-bottom: 5px; padding: clamp(12px, 2.2vh, 20px) clamp(12px, 4vw, 20px);
      border: var(--line); border-radius: 24px; background: var(--card); box-shadow: 0 5px 0 var(--ink);
    }
    form { flex: none; }
    #result { flex: 1 0 auto; }
    input, button { font: inherit; color: inherit; }
    button { touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
    :focus-visible { outline: 3px solid #2b7fff; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* お会計 */
    .total {
      flex: none; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 8px;
      border: var(--line); border-radius: 18px; background: var(--cream); transition: background .15s, box-shadow .15s;
    }
    .total:focus-within { background: #fff; box-shadow: 0 0 0 4px var(--bg); }
    .total label { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .8rem; font-weight: 800; }
    .total input {
      flex: 1; width: 100%; min-width: 0; height: clamp(40px, 7vh, 54px); padding: 0; border: 0; outline: 0; background: transparent;
      text-align: right; font-size: clamp(1.5rem, 4.6vh, 2.1rem); font-weight: 900; font-variant-numeric: tabular-nums;
      appearance: textfield; -moz-appearance: textfield;
    }
    .total input::placeholder { color: #b9c4bd; }
    .total span { font-weight: 800; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* テンキー */
    .keypad { flex: none; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    .key {
      display: grid; place-items: center; height: clamp(38px, 6vh, 46px); margin-bottom: 3px; padding: 0;
      border: 2px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink);
      font-size: 1.25rem; font-weight: 900; font-variant-numeric: tabular-nums;
    }
    .key:active { transform: translateY(3px); box-shadow: none; }
    .key-back { background: var(--cream); font-size: 1rem; }
    .key svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    /* 人数（常に5列） */
    fieldset { flex: none; border: 0; margin: 0; padding: 0; min-width: 0; }
    .groups { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .count-card {
      min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 8px 4px; border: 2px solid var(--ink); border-radius: 16px; background: var(--tint);
      transition: background .2s;
    }
    .count-card label { display: flex; flex-direction: column; align-items: center; font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .count-card .char { width: clamp(34px, 6.5vh, 52px); height: clamp(34px, 6.5vh, 52px); }
    .count-card.is-zero { background: #f3f1ea; }
    .count-card.is-zero input { color: #9aa9a1; }
    .count-card.bump .char { animation: bump .3s cubic-bezier(.3, 1.6, .6, 1); }
    .stepper { width: 100%; display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; }
    .count-step {
      flex: none; display: grid; place-items: center; width: 100%; max-width: 64px; height: 40px; margin-bottom: 3px; padding: 0;
      border: 2px solid var(--ink); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--ink);
    }
    .count-step svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
    .count-step:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    .count-step:disabled { opacity: .3; cursor: default; }
    .count-card .field { display: flex; align-items: baseline; justify-content: center; gap: 1px; width: 100%; font-size: .75rem; font-weight: 800; }
    .count-card input {
      width: 100%; max-width: 46px; min-width: 0; height: 36px; padding: 0; border: 0; border-radius: 10px; background: transparent;
      text-align: center; font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums;
      appearance: textfield; -moz-appearance: textfield;
    }
    .count-card input:focus { background: #fff; outline: 2px solid var(--ink); }

    /* ボタン */
    .primary, .secondary {
      flex: none; width: 100%; height: clamp(48px, 7.5vh, 60px); margin-bottom: 5px; padding: 0;
      border: var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
      font-size: 1.15rem; font-weight: 900; letter-spacing: .12em;
    }
    .primary { background: var(--coral); }
    .secondary { background: #fff; }
    .primary:active, .secondary:active { transform: translateY(5px); box-shadow: none; }
    #error { color: #b3261e; font-size: .85rem; font-weight: 800; text-align: center; }
    #error:empty { display: none; }

    /* 結果 */
    h2 { margin: 0; }
    #result-title {
      align-self: flex-start; padding: 1px 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--bg);
      font-size: .9rem; font-weight: 900; transform: rotate(-2deg); outline-offset: 4px;
    }
    dl, dd { margin: 0; }
    .tiers { flex: 1 0 auto; display: flex; flex-direction: column; gap: 6px; }
    .tier {
      flex: 1; min-height: 48px; max-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 2px 14px 2px 10px; border: 2px solid var(--ink); border-radius: 16px; background: var(--tint);
      animation: pop .4s cubic-bezier(.3, 1.3, .6, 1) backwards; animation-delay: calc(var(--i) * 50ms);
    }
    .tier dt { display: flex; align-items: center; gap: 8px; font-weight: 800; white-space: nowrap; }
    .result-count { padding: 0 8px; border-radius: 999px; background: #fff; font-size: .75rem; }
    .tier dd { font-size: clamp(1.25rem, 5.5vw, 1.6rem); font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .summary { flex: none; padding-top: 8px; border-top: 2.5px dashed var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
    .summary div { display: flex; justify-content: space-between; gap: 8px; padding: 1px 4px; }
    .actions { flex: none; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

    @keyframes pop { from { opacity: 0; transform: scale(.8); } }
    @keyframes bump { 40% { transform: scale(1.25) rotate(-8deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ホーム画面に追加 */
    #install-promo { flex-shrink: 0; display: flex; justify-content: center; }
    #install-help {
      display: inline-flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; text-align: left;
    }
    .install-icon { display: block; width: 52px; height: 52px; border: 2px solid var(--ink); border-radius: 24%; box-shadow: 3px 3px 0 var(--ink); }
    .install-message { display: block; font-size: .8rem; font-weight: 800; }
    .install-label { display: inline-block; margin-top: 2px; padding: 3px 14px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font-size: .8rem; font-weight: 800; }
    dialog {
      width: min(400px, calc(100% - 28px)); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 24px;
      border: var(--line); border-radius: 28px; color: var(--ink); background: var(--cream); box-shadow: 0 8px 0 var(--ink);
    }
    dialog::backdrop { background: rgb(23 60 46 / .55); }
    dialog .install-icon { width: 88px; height: 88px; margin: 0 auto 12px; }
    dialog h2 { font-size: 1.15rem; font-weight: 900; text-align: center; }
    dialog ol { list-style: none; counter-reset: steps; padding: 0; margin: 16px 0; }
    dialog li { counter-increment: steps; display: flex; align-items: flex-start; gap: 10px; margin: 8px 0; padding: 12px; border: 2px solid var(--ink); border-radius: 16px; background: #fff; font-size: .85rem; font-weight: 600; }
    dialog li::before { content: counter(steps); flex: 0 0 26px; line-height: 22px; text-align: center; border: 2px solid var(--ink); border-radius: 50%; background: var(--bg); font-weight: 900; }
    dialog p { font-size: .85rem; font-weight: 700; margin: 12px 0; text-align: center; }

    /* PC・タブレット: カードを引き伸ばさず中央にまとめる */
    @media (min-width: 600px) and (min-height: 541px) {
      main { justify-content: center; }
      #result { flex: 0 1 auto; }
      .tiers { flex: none; }
      .count-card .char { width: 56px; height: 56px; }
      .count-card label { font-size: .9rem; }
      .tier { flex: none; height: 62px; }
      .tier .char { width: 46px; height: 46px; }
    }
    @media (max-height: 760px) {
      .tiers { gap: 4px; }
      .tier { min-height: 32px; padding-block: 0; line-height: 1.2; }
      .tier .char { width: 30px; height: 30px; }
      .summary { padding-top: 6px; }
    }
    @media (max-height: 600px) {
      .site-header p { display: none; }
      .install-icon { width: 40px; height: 40px; }
      #install-help { gap: 10px; }
      .install-message { display: inline; margin-right: 6px; }
    }
    @media (max-height: 540px) and (min-width: 600px) {
      main { max-width: 900px; }
      .site-header p { display: block; }
      .tiers { display: grid; grid-template-columns: 1fr 1fr; }
    }
  </style>
  <script src="./warikan.js" defer></script>
</head>
<body>
  <main>
    <header class="site-header">
      <h1 class="site-name"><svg class="char" aria-hidden="true"><use href="./chars.svg#beer"/></svg>warikan</h1>
      <p>飲み会のお会計をいい感じに割り勘。</p>
    </header>
    <form id="split">
      <div class="total">
        <label for="total">お会計</label>
        <input id="total" type="number" inputmode="numeric" enterkeyhint="done" min="1" max="999999999" required placeholder="0">
        <span>円</span>
      </div>
      <div class="keypad" role="group" aria-label="お会計のテンキー">
        <button class="key" type="button" data-key="1">1</button><button class="key" type="button" data-key="2">2</button><button class="key" type="button" data-key="3">3</button><button class="key" type="button" data-key="4">4</button><button class="key" type="button" data-key="5">5</button><button class="key key-back" type="button" data-key="back" aria-label="1文字消す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7ZM12 9.500l5 5M17 9.500l-5 5"/></svg></button>
        <button class="key" type="button" data-key="6">6</button><button class="key" type="button" data-key="7">7</button><button class="key" type="button" data-key="8">8</button><button class="key" type="button" data-key="9">9</button><button class="key" type="button" data-key="0">0</button><button class="key key-back" type="button" data-key="clear" aria-label="お会計をクリア">AC</button>
      </div>
      <fieldset>
        <legend class="sr-only">人数</legend>
        <div class="groups">
          <div class="count-card t0">
            <label for="count-0"><svg class="char" aria-hidden="true"><use href="./chars.svg#daifugo"/></svg><span>大富豪</span></label>
            <div class="stepper">
              <button class="count-step" type="button" data-step="-1" data-target="count-0" aria-label="大富豪を1人減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="field"><input id="count-0" name="count" aria-label="大富豪の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
              <button class="count-step" type="button" data-step="1" data-target="count-0" aria-label="大富豪を1人増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
          <div class="count-card t1">
            <label for="count-1"><svg class="char" aria-hidden="true"><use href="./chars.svg#fugo"/></svg><span>富豪</span></label>
            <div class="stepper">
              <button class="count-step" type="button" data-step="-1" data-target="count-1" aria-label="富豪を1人減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="field"><input id="count-1" name="count" aria-label="富豪の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
              <button class="count-step" type="button" data-step="1" data-target="count-1" aria-label="富豪を1人増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
          <div class="count-card t2">
            <label for="count-2"><svg class="char" aria-hidden="true"><use href="./chars.svg#heimin"/></svg><span>平民</span></label>
            <div class="stepper">
              <button class="count-step" type="button" data-step="-1" data-target="count-2" aria-label="平民を1人減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="field"><input id="count-2" name="count" aria-label="平民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="2"><span>人</span></span>
              <button class="count-step" type="button" data-step="1" data-target="count-2" aria-label="平民を1人増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
          <div class="count-card t3">
            <label for="count-3"><svg class="char" aria-hidden="true"><use href="./chars.svg#hinmin"/></svg><span>貧民</span></label>
            <div class="stepper">
              <button class="count-step" type="button" data-step="-1" data-target="count-3" aria-label="貧民を1人減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="field"><input id="count-3" name="count" aria-label="貧民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
              <button class="count-step" type="button" data-step="1" data-target="count-3" aria-label="貧民を1人増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
          <div class="count-card t4">
            <label for="count-4"><svg class="char" aria-hidden="true"><use href="./chars.svg#daihinmin"/></svg><span>大貧民</span></label>
            <div class="stepper">
              <button class="count-step" type="button" data-step="-1" data-target="count-4" aria-label="大貧民を1人減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="field"><input id="count-4" name="count" aria-label="大貧民の人数" type="number" inputmode="numeric" min="0" max="9999" required value="0"><span>人</span></span>
              <button class="count-step" type="button" data-step="1" data-target="count-4" aria-label="大貧民を1人増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
            </div>
          </div>
        </div>
      </fieldset>
      <p id="error" role="alert"></p>
      <button class="primary" type="submit">割り勘</button>
    </form>
    <section id="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title" tabindex="-1">1人あたり</h2>
      <dl class="tiers">
        <div class="tier t0" style="--i:0"><dt><svg class="char" aria-hidden="true"><use href="./chars.svg#daifugo"/></svg><span>大富豪</span><span class="result-count" data-count></span></dt><dd data-price></dd></div>
        <div class="tier t1" style="--i:1"><dt><svg class="char" aria-hidden="true"><use href="./chars.svg#fugo"/></svg><span>富豪</span><span class="result-count" data-count></span></dt><dd data-price></dd></div>
        <div class="tier t2" style="--i:2"><dt><svg class="char" aria-hidden="true"><use href="./chars.svg#heimin"/></svg><span>平民</span><span class="result-count" data-count></span></dt><dd data-price></dd></div>
        <div class="tier t3" style="--i:3"><dt><svg class="char" aria-hidden="true"><use href="./chars.svg#hinmin"/></svg><span>貧民</span><span class="result-count" data-count></span></dt><dd data-price></dd></div>
        <div class="tier t4" style="--i:4"><dt><svg class="char" aria-hidden="true"><use href="./chars.svg#daihinmin"/></svg><span>大貧民</span><span class="result-count" data-count></span></dt><dd data-price></dd></div>
      </dl>
      <dl class="summary">
        <div><dt>合計</dt><dd id="collected"></dd></div>
        <div><dt>お会計</dt><dd id="payment"></dd></div>
        <div><dt>おつり</dt><dd id="change"></dd></div>
      </dl>
      <div class="actions">
        <button id="back" class="secondary" type="button">戻る</button>
        <button id="retry" class="primary" type="button">再計算</button>
      </div>
    </section>
    <div id="install-promo">
      <button id="install-help" type="button" aria-haspopup="dialog" aria-labelledby="install-label">
        <img class="install-icon" src="./icon.svg" alt="" width="52" height="52">
        <span class="install-copy">
          <span class="install-message">追加して便利に使おう！</span>
          <span class="install-label" id="install-label">ホーム画面に追加</span>
        </span>
      </button>
    </div>
    <footer class="site-footer">
      <a href="./about/index.html">使い方・計算ルール</a>
      <p>made with <span aria-label="love">♥</span> by <a href="https://naoqoo2.com/apps/">naoqoo2</a></p>
    </footer>
  </main>
  <dialog id="install-dialog" aria-labelledby="install-title">
    <img class="install-icon" src="./icon.svg" alt="" width="88" height="88">
    <h2 id="install-title">warikanをホーム画面に</h2>
    <p id="install-intro"></p>
    <ol id="install-steps"></ol>
    <button id="install-close" class="primary" type="button" autofocus>わかった！</button>
  </dialog>
</body>
</html>
